name: Build & Package Installers (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
      - 'windows-setup*'
      - 'release*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup Wizard (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows NSIS Setup Wizard & Portable Binary
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ErgoGotchi-Windows-Installers
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: ignore

  build-macos:
    name: Build macOS DMG Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Package macOS DMG Installer
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ErgoGotchi-macOS-Installers
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ErgoGotchi-Windows-Installers
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ErgoGotchi-macOS-Installers
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_name == 'windows-setup' && 'ErgoGotchi v1.0.0 — Official Desktop Companion (Windows & macOS)' || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ErgoGotchi v1.0.0 — Official Release') }}
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
