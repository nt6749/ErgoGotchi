[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Automatic Live Console Logging for every run
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Automatic Persistent Audit Log File
log_file = backend/tests/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)d) %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
