version: '3.8'

services:
  # Tiger Data / TimescaleDB Engine
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: ergogotchi-tigerdata
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ergogotchi
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ergogotchi-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password123@timescaledb:5432/ergogotchi
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-3.8-flash
      - SHARED_TOKEN=ergogotchi_sunhacks_2026_secret
      - GROK_WEBHOOK_URL=${GROK_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
